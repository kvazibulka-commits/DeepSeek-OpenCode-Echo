<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭХО · ночной пульт</title>
<style>
  :root {
    --bg: #07090E;
    --surface: #0D121B;
    --elevated: #151E2A;
    --line: #1E293B;
    --line-strong: #334155;
    --text: #F2F5F7;
    --secondary: #85909E;
    --dim: #64748B;
    --cyan: #00F0FF;
    --sky: #38BDF8;
    --purple: #A855F7;
    --amber: #FFB800;
    --gold: #FFD700;
    --green: #34D399;
    --danger: #FF5533;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(56,189,248,.10), transparent 60%),
      radial-gradient(800px 460px at 100% 0%, rgba(168,85,247,.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1320px; margin: 0 auto; padding: 26px 22px 70px; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--line); padding-bottom: 18px;
  }
  .brand { font-size: 26px; font-weight: 900; letter-spacing: 5px; }
  .brand span { font-size: 11px; letter-spacing: 2px; color: var(--dim); font-weight: 500; margin-left: 10px; }
  .live { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--secondary); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px rgba(52,211,153,.7); }
  .live.off i { background: var(--danger); box-shadow: 0 0 10px rgba(255,85,51,.6); }
  .spacer { flex: 1; }
  .ghost {
    background: transparent; color: var(--secondary); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font-size: 11px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--line-strong); color: var(--text); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0 30px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 15px 17px; }
  .kpi b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .kpi span { display: block; margin-top: 7px; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); }
  .kpi.cyan b { color: var(--cyan); } .kpi.amber b { color: var(--amber); }
  .kpi.gold b { color: var(--gold); } .kpi.green b { color: var(--green); }

  h2 { margin: 26px 0 12px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  h2 em { font-style: normal; color: var(--secondary); margin-left: 8px; letter-spacing: 0; text-transform: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px; display: flex; gap: 12px; min-width: 0;
  }
  .cover {
    width: 62px; height: 62px; border-radius: 14px; flex: 0 0 auto; overflow: hidden;
    background: linear-gradient(135deg, var(--sky), var(--purple));
    display: grid; place-items: center; font-size: 15px; font-weight: 800; color: #0B0E14;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { min-width: 0; flex: 1; }
  .persona { font-size: 9px; letter-spacing: .9px; text-transform: uppercase; color: var(--sky); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { margin-top: 3px; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { margin-top: 2px; font-size: 10px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip { font-size: 9px; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: #B6C0CD; white-space: nowrap; }
  .chip.hot { color: var(--cyan); border-color: rgba(0,240,255,.4); }
  .chip.ghost { color: var(--amber); border-color: rgba(255,184,0,.45); }

  .split { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
  .list { display: flex; flex-direction: column; gap: 9px; }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .row .top { display: flex; align-items: baseline; gap: 8px; }
  .row .who { font-size: 11px; color: var(--secondary); }
  .row .what { font-size: 13px; font-weight: 600; }
  .row .meta { margin-top: 4px; font-size: 10px; color: var(--dim); }
  .badge { font-size: 8px; letter-spacing: .8px; text-transform: uppercase; border-radius: 999px; padding: 3px 7px; border: 1px solid var(--line-strong); color: var(--dim); }
  .badge.lock { color: var(--gold); border-color: rgba(255,215,0,.4); }
  .badge.venue { color: var(--amber); border-color: rgba(255,184,0,.4); }
  .symbol { font-size: 17px; color: var(--gold); flex: 0 0 auto; }
  .trace { font-size: 11px; color: var(--secondary); border-left: 2px solid rgba(255,184,0,.45); padding-left: 10px; margin-top: 7px; }

  .empty { color: var(--dim); font-size: 12px; padding: 18px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; }

  dialog {
    border: 1px solid var(--line-strong); border-radius: 20px; background: var(--elevated);
    color: var(--text); padding: 22px; max-width: 420px; width: calc(100% - 36px);
  }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h3 { margin: 0 0 8px; font-size: 17px; }
  dialog p { margin: 0 0 14px; font-size: 12px; color: var(--secondary); line-height: 1.5; }
  dialog input {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--text); font-size: 12px;
  }
  dialog .actions { display: flex; gap: 8px; margin-top: 14px; }
  dialog button { flex: 1; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 11px; }
  dialog .primary { background: var(--cyan); color: #0B0E14; border: none; font-weight: 700; }
  dialog .secondary { background: transparent; color: var(--secondary); border: 1px solid var(--line-strong); }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .app { padding: 18px 14px 50px; }
    .brand { font-size: 21px; letter-spacing: 3px; }
    .kpi b { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">ЭХО <span>ночной пульт</span></div>
    <div class="live" id="live"><i></i><span>линия живая</span></div>
    <div class="spacer"></div>
    <button class="ghost" id="tokenButton">Токен</button>
  </header>

  <section class="kpis">
    <div class="kpi cyan"><b id="kpiSignals">0</b><span>сигналов в эфире</span></div>
    <div class="kpi amber"><b id="kpiCapsules">0</b><span>тайников</span></div>
    <div class="kpi gold"><b id="kpiReactions">0</b><span>откликов за вечер</span></div>
    <div class="kpi green"><b id="kpiZone">—</b><span>активный квартал</span></div>
  </section>

  <h2>Сигналы <em id="signalsHint"></em></h2>
  <div class="grid" id="signals"></div>

  <div class="split">
    <section>
      <h2>Тайники <em id="capsulesHint"></em></h2>
      <div class="list" id="capsules"></div>
    </section>
    <section>
      <h2>Отклики <em id="reactionsHint"></em></h2>
      <div class="list" id="reactions"></div>
    </section>
  </div>

  <h2>Летопись вечера</h2>
  <div class="list" id="history"></div>
</div>

<dialog id="tokenDialog">
  <h3>Токен доступа</h3>
  <p>Нужен, если пульт открыт через туннель. В домашней сети можно оставить пустым.</p>
  <input id="tokenInput" type="password" autocomplete="off" placeholder="X-Echo-Token">
  <div class="actions">
    <button class="secondary" id="tokenCancel">Отмена</button>
    <button class="primary" id="tokenSave">Сохранить</button>
  </div>
</dialog>

<script>
  const POLL_MS = 2500;
  const deviceId = localStorage.getItem("echo_dashboard_id") || (() => {
    const id = "dashboard_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("echo_dashboard_id", id);
    return id;
  })();
  let token = localStorage.getItem("echo_token") || "";
  let lastState = null;

  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));

  function coverBlock(signal) {
    if (signal.coverUrl) {
      return `<div class="cover"><img src="${esc(signal.coverUrl)}" alt=""></div>`;
    }
    const letter = (signal.artist || "Э").trim().charAt(0).toUpperCase();
    return `<div class="cover">${esc(letter)}</div>`;
  }

  function renderSignal(signal) {
    const album = signal.album ? `<div class="album">${esc(signal.album)}</div>` : "";
    const ghost = signal.isGhost ? `<span class="chip ghost">призрак</span>` : "";
    return `
      <article class="card">
        ${coverBlock(signal)}
        <div class="body">
          <div class="persona">${esc(signal.personaTitle)}</div>
          <div class="track">${esc(signal.artist)} — ${esc(signal.title)}</div>
          ${album}
          <div class="chips">
            <span class="chip hot">${esc(signal.compatibilityPercent)}%</span>
            <span class="chip">${esc(signal.bpm)} BPM</span>
            <span class="chip">${esc(signal.camelotKey)}</span>
            <span class="chip">${esc(signal.zoneName)}</span>
            ${ghost}
          </div>
        </div>
      </article>`;
  }

  function renderCapsule(capsule) {
    const locked = !capsule.isUnlocked;
    const venue = capsule.isVenue ? `<span class="badge venue">заведение</span>` : "";
    const lock = locked ? `<span class="badge lock">замок ${esc(capsule.minResonance)}%</span>` : "";
    return `
      <article class="row">
        <div class="top">
          <span class="what">${esc(capsule.artist)} — ${esc(capsule.title)}</span>
          ${venue}${lock}
        </div>
        <div class="album">${esc(capsule.album || capsule.zoneName)}</div>
        <div class="meta">${locked ? "послание закрыто" : esc(capsule.secretMessage)}</div>
      </article>`;
  }

  function renderReaction(reaction) {
    return `
      <article class="row" style="display:flex;gap:10px;align-items:flex-start">
        <span class="symbol">${esc(reaction.symbol)}</span>
        <div>
          <div class="what">${esc(reaction.message)}</div>
          <div class="meta">${esc(reaction.senderId)}</div>
        </div>
      </article>`;
  }

  function render(state) {
    lastState = state;
    const signals = state.signals || [];
    const capsules = state.capsules || [];
    const reactions = (state.reactionsHistory || []).slice().reverse();

    $("kpiSignals").textContent = signals.length;
    $("kpiCapsules").textContent = capsules.length;
    $("kpiReactions").textContent = state.reactionsHistory ? state.reactionsHistory.length : 0;
    const zones = state.cityZones || [];
    const activeZone = zones.slice().sort((a, b) => (b.listenersCount || 0) - (a.listenersCount || 0))[0];
    $("kpiZone").textContent = activeZone ? activeZone.placeName.split(" ")[0] : "—";

    $("signalsHint").textContent = signals.length ? `${signals.length} в эфире` : "";
    $("signals").innerHTML = signals.length
      ? signals.map(renderSignal).join("")
      : `<div class="empty">В эфире тихо. Запустите музыку на телефоне или ПК.</div>`;

    $("capsulesHint").textContent = capsules.length ? `${capsules.length} найдено` : "";
    $("capsules").innerHTML = capsules.length
      ? capsules.map(renderCapsule).join("")
      : `<div class="empty">Тайников пока нет.</div>`;

    $("reactionsHint").textContent = reactions.length ? `${reactions.length} за вечер` : "";
    $("reactions").innerHTML = reactions.length
      ? reactions.map(renderReaction).join("")
      : `<div class="empty">Отклики появятся, когда кто-то ответит на волну.</div>`;

    const traces = state.eveningTraces || [];
    $("history").innerHTML = traces.length
      ? traces.map((trace) => `<div class="trace">${esc(trace)}</div>`).join("")
      : `<div class="empty">Летопись пуста.</div>`;
  }

  async function poll() {
    try {
      const headers = {};
      if (token) headers["X-Echo-Token"] = token;
      const response = await fetch(`/api/state?deviceId=${encodeURIComponent(deviceId)}`, { headers });
      if (response.status === 401) {
        $("live").classList.add("off");
        $("live").querySelector("span").textContent = "нужен токен";
        openTokenDialog();
        return;
      }
      if (!response.ok) throw new Error("HTTP " + response.status);
      const state = await response.json();
      $("live").classList.remove("off");
      $("live").querySelector("span").textContent = "линия живая";
      render(state);
    } catch (error) {
      $("live").classList.add("off");
      $("live").querySelector("span").textContent = "нет связи";
    }
  }

  function openTokenDialog() {
    if ($("tokenDialog").open) return;
    $("tokenInput").value = token;
    $("tokenDialog").showModal();
  }

  $("tokenButton").addEventListener("click", openTokenDialog);
  $("tokenCancel").addEventListener("click", () => $("tokenDialog").close());
  $("tokenSave").addEventListener("click", () => {
    token = $("tokenInput").value.trim();
    if (token) localStorage.setItem("echo_token", token);
    else localStorage.removeItem("echo_token");
    $("tokenDialog").close();
    poll();
  });

  setInterval(poll, POLL_MS);
  poll();
</script>
</body>
</html>
